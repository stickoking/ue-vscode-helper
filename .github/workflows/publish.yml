# Publish to Visual Studio Marketplace (VS Code) and Open VSX (Cursor).
#
# Triggers: version tags (v1.1.0) or manual workflow_dispatch.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VS_MARKETPLACE_TOKEN  — Azure DevOps PAT for marketplace.visualstudio.com
#   OPEN_VSX_TOKEN        — https://open-vsx.org/user-settings/tokens
#                           Claim/create namespace `stickoking` on Open VSX first.
#
# Targets:
#   • Visual Studio Marketplace → VS Code
#   • Open VSX → Cursor (and VSCodium / other non-MS editors)

name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_vs_marketplace:
        description: 'Publish to Visual Studio Marketplace (VS Code)'
        type: boolean
        default: true
      publish_open_vsx:
        description: 'Publish to Open VSX (Cursor)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run package

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out ue-vscode-helper.vsix

      - name: Publish to Open VSX (Cursor)
        if: ${{ github.event_name == 'push' || inputs.publish_open_vsx }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ue-vscode-helper.vsix

      - name: Publish to Visual Studio Marketplace (VS Code)
        if: ${{ github.event_name == 'push' || inputs.publish_vs_marketplace }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ue-vscode-helper.vsix
